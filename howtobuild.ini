ดีเลย — เข้าใจโจทย์ที่อยากได้:

1. หา symbol แบบ partial / substring (ไม่ต้อง exact SymFromName) — เช่น เจอชื่อที่มี ::ClassName::func หรือ SomeNamespace::func ก็ถือว่า match


2. เอา std::vector<uint8_t> datamen (อ่าน byte จาก process) มา cs_disasm โดยให้ address ของ instruction ตรงกับ process ที่รันจริง (ตั้ง base address เอง)


3. คำนวณ offset / pointer target ให้สัมพันธ์กับ basemoduleruntime เพื่อเอาไปแสดงใน UI ให้ไม่ผิด



ต่อไปนี้โค้ดตัวอย่าง (เต็มรูปแบบ) ที่ทำทั้งหมดข้างบน — คัดลอกไปใส่โปรเจ็กต์ แล้วปรับชื่อตัวแปรตามของจริงได้เลย:

// ตัวอย่าง: Windows, Capstone, DbgHelp
#include <windows.h>
#include <dbghelp.h>
#include <vector>
#include <string>
#include <iostream>
#include <memory>
#include <algorithm>
#include <capstone/capstone.h>

#pragma comment(lib, "Dbghelp.lib")

// ---------- 1) SymEnumSymbols callback เพื่อค้นหาแบบ substring ----------
struct SymSearchCtx {
    std::string search;                // ชื่อที่ต้องการค้นหา (substring)
    std::vector<std::string> found;    // เก็บชื่อที่ match
};

BOOL CALLBACK EnumSymbolsCallback(PSYMBOL_INFO pSymInfo, ULONG SymbolSize, PVOID UserContext) {
    SymSearchCtx* ctx = reinterpret_cast<SymSearchCtx*>(UserContext);
    if (!pSymInfo || !ctx) return TRUE;

    std::string name(pSymInfo->Name, pSymInfo->NameLen);
    // ทำเป็น case-insensitive ถ้าต้องการ:
    // tolower ทั้งสองฝั่ง หรือเอา .find ที่ไม่สนใจ case (ไม่ใส่ที่นี่)

    if (name.find(ctx->search) != std::string::npos) {
        ctx->found.push_back(name);
    }
    return TRUE; // return TRUE เพื่อให้ enumeration ดำเนินต่อ
}

// ใช้แบบ:
// SymSearchCtx ctx{ "MyFuncPartial" };
// SymEnumSymbols(processHandle, 0, nullptr, EnumSymbolsCallback, &ctx);
// ผล: ctx.found มีชื่อทั้งหมดที่มี substring นั้น

// ---------- 2) Disassemble + pointer extraction ----------
struct InsnPointerInfo {
    uint64_t insnAddress;
    std::string mnemonic;
    std::string op_str;
    bool isPointer = false;
    uint64_t pointerAbsolute = 0;            // ถาพจะหาค่า absolute ได้ (ถ้าหาได้)
    int64_t pointerOffsetFromModule = 0;     // pointerAbsolute - basemoduleruntime
};

std::vector<InsnPointerInfo> DisasmAndExtract(
    const std::vector<uint8_t>& datamen,       // bytes read from process
    uint64_t baseProcessAddress,               // ที่ datamen[0] ถูก mapped เป็น address นี้
    uint64_t basemoduleruntime                  // module runtime base ที่ต้องการเป็น ref (UI)
) {
    std::vector<InsnPointerInfo> results;
    csh handle;
    if (cs_open(CS_ARCH_X86, CS_MODE_64, &handle) != CS_ERR_OK) {
        return results;
    }
    cs_option(handle, CS_OPT_DETAIL, CS_OPT_ON);

    cs_insn* insn = nullptr;
    size_t count = cs_disasm(handle, datamen.data(), datamen.size(), baseProcessAddress, 0, &insn);
    if (count > 0) {
        // ถ้าต้องการคำนวณ offset ตามคำสั่ง: นี่ฟังก์ชันทดแทน macro
        auto CS_INSN_OFFSET = [&](const cs_insn* insns, size_t index)->uint64_t {
            if (!insns || index == 0) return 0;
            return insns[index].address - insns[0].address;
        };

        for (size_t i = 0; i < count; ++i) {
            InsnPointerInfo r;
            r.insnAddress = insn[i].address;
            r.mnemonic = insn[i].mnemonic ? insn[i].mnemonic : "";
            r.op_str = insn[i].op_str ? insn[i].op_str : "";

            // ตรวจ operand memory เพื่อหา displacement / pointer
            if (insn[i].detail && insn[i].detail->x86.op_count > 0) {
                for (int j = 0; j < insn[i].detail->x86.op_count; ++j) {
                    cs_x86_op op = insn[i].detail->x86.operands[j];
                    if (op.type == X86_OP_MEM) {
                        r.isPointer = true;

                        // กรณี RIP-relative addressing:
                        if (op.mem.base == X86_REG_RIP) {
                            // target = next_instruction_address + disp
                            uint64_t next_insn = insn[i].address + insn[i].size;
                            int64_t disp = op.mem.disp; // signed displacement
                            uint64_t absoluteTarget = static_cast<uint64_t>( (int64_t)next_insn + disp );
                            r.pointerAbsolute = absoluteTarget;
                            r.pointerOffsetFromModule = (int64_t)absoluteTarget - (int64_t)basemoduleruntime;
                        }
                        else if (op.mem.base == X86_REG_INVALID && op.mem.index == X86_REG_INVALID) {
                            // อาจเป็น absolute displacement (เช่น mov rax, qword ptr [0x140012345])
                            uint64_t absoluteTarget = static_cast<uint64_t>(op.mem.disp);
                            r.pointerAbsolute = absoluteTarget;
                            r.pointerOffsetFromModule = (int64_t)absoluteTarget - (int64_t)basemoduleruntime;
                        }
                        else {
                            // ถ้ามีฐานเป็น register (เช่น [rax + 0x20]) — เราไม่รู้ค่ารันไทม์ของ register ที่นี่
                            // แต่เรายังสามารถเก็บ displacement ได้ (เป็น pointerOffset แบบ relative to instruction)
                            int64_t disp = op.mem.disp;
                            // เก็บเป็น pointerAbsolute = 0 เพื่อบอกว่าไม่สามารถ resolve แบบ absolute ได้
                            r.pointerAbsolute = 0;
                            r.pointerOffsetFromModule = 0;
                            // คุณอาจเก็บ disp ให้ UI แสดง: e.g. "reg+0xdisp"
                            // หรือถ้าคุณมี snapshot ของ registers ขณะรันจริง ให้คำนวณต่อที่นี่
                        }
                    }
                }
            }

            results.push_back(r);
        }
        cs_free(insn, count);
    }
    cs_close(&handle);
    return results;
}

