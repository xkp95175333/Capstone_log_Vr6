// ---------- หมายเหตุสำคัญ ----------
/*
1) SymFromName ไม่รองรับ substring. ให้ใช้ SymEnumSymbols (หรือ SymEnumSymbolsEx) แล้วเทียบชื่อด้วย find/strstr
   - SymEnumSymbols ต้องเรียกหลัง SymInitialize(process, NULL, FALSE) และมักต้อง SymLoadModuleEx ถ้าอยาก enumerate module-specific symbols.

2) การ map datamen -> addresses:
   - ถ้า datamen[0] เท่ากับ byte ที่ process ใช้ที่ address X, ให้ใส่ baseProcessAddress = X ใน cs_disasm
     เช่น cs_disasm(datamen.data(), datamen.size(), baseProcessAddress, 0, &insn);
   - insn[].address จะออกมาเป็นค่ารันไทม์จริง (matching process memory) ถ้าคุณตั้ง baseProcessAddress ให้ถูก

3) การ resolve pointer:
   - RIP-relative: target = insn.address + insn.size + disp  (เราใช้วิธีนี้ในตัวอย่าง)
   - Absolute disp: ถ้า op.mem.base==INVALID และ op.mem.index==INVALID มักหมายถึง absolute address (op.mem.disp)
   - Register-based: ถ้ามี base register (rax, rbx ฯลฯ) คุณต้องอ่านค่าจาก registers ที่รันจริงเพื่อ resolve (ถ้าอยาก resolve จริง)

4) CS_INSN_OFFSET:
   - macro เดิมของคุณใช้ position แบบ 1-based; ใน code ข้างบนผมให้ lambda ที่ใช้ index 0-based:
       insns[index].address - insns[0].address
   - ถ้าคุณจะเก็บ offset สำหรับ UI ให้คำนวณ pointerOffsetFromModule ตามที่ต้องการ

5) Security / privileges:
   - ถ้าอยากอ่าน process memory / registers ของ process อื่น ต้องมีสิทธิ์ (SeDebugPrivilege) หรือรันเป็น administrator.

*/

สรุปสั้น ๆ ที่ต้องทำตอนนี้:

เปลี่ยนจาก SymFromName → SymEnumSymbols แล้วหา substring (.find) เพื่อรองรับชื่อที่ติด class:: หรือ prefix อื่น ๆ

เมื่อต้องการให้ cs_disasm แสดง address ตรงกับ process จริง ให้เรียก cs_disasm(datamen.data(), datamen.size(), baseProcessAddress, ...) โดยตั้ง baseProcessAddress ให้ตรงกับ address ของ datamen[0] (เช่น module base runtime)

สำหรับ pointer extraction: ตรวจ op.mem.base — ถ้าเป็น RIP ใช้ insn.address + insn.size + disp เพื่อหา absolute; ถ้าเป็น absolute disp ใช้ op.mem.disp; ถ้าเป็น register-based — ต้องอ่านค่า register ขณะรันจริงเพื่อ resolve


ถ้าชอบ ผมจะ:

แก้ตัวอย่างให้ integrate กับฟังก์ชันอ่าน memory ของคุณ (ReadProcessMemory) และตัวเลือกการตั้ง baseProcessAddress อัตโนมัติ (เช่น หา module base ด้วย EnumProcessModules หรือ CreateToolhelp32Snapshot)

หรือทำเวอร์ชันที่คืนค่าเป็น JSON/struct ที่พร้อมส่งเข้า UI (ImGui) ให้แสดงทันที


